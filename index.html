<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬AI予想＆自動検証ノート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* スクロールバーを少し細くする調整 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-10">

  <!-- ヘッダー -->
  <header class="bg-white py-4 shadow-sm text-center mb-4">
    <h1 class="text-xl font-bold text-gray-700">🐎 競馬AI予想＆自動検証ノート</h1>
  </header>

  <div class="max-w-3xl mx-auto px-2">
    <!-- タブメニュー（見た目のみ再現） -->
    <div class="grid grid-cols-5 gap-1 mb-1">
      <button class="bg-gray-100 text-gray-500 py-2 border rounded-t text-xs">①指数</button>
      <button class="bg-gray-100 text-gray-500 py-2 border rounded-t text-xs">②偏差値</button>
      <button class="bg-white text-red-600 font-bold py-2 border-t border-l border-r rounded-t text-xs shadow-[0_-2px_0_0_#ef4444]">③変わり身</button>
      <button class="bg-gray-100 text-gray-500 py-2 border rounded-t text-xs">④AI予想</button>
      <button class="bg-gray-100 text-gray-500 py-2 border rounded-t text-xs">⑤待機中</button>
    </div>
    <div class="grid grid-cols-2 gap-1 mb-4">
      <button class="bg-gray-100 text-gray-500 py-2 border rounded-b text-xs">⑥検証メモ</button>
      <button class="bg-gray-100 text-gray-500 py-2 border rounded-b text-xs">⑦蓄積一覧</button>
    </div>

    <!-- メインコンテンツエリア -->
    <div class="bg-white border rounded-lg shadow-sm p-4">
      
      <!-- レース名入力 -->
      <div class="mb-4">
        <label class="block text-sm font-bold text-gray-600 mb-1">レース名</label>
        <input type="text" value="2026 11/1 京都11R まほろばS" class="w-full border border-gray-300 rounded p-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>

      <!-- テキストペーストエリア -->
      <div class="mb-4">
        <label class="block text-sm font-bold text-gray-600 mb-1">「変わり身チェック」テキストをペースト</label>
        <!-- ここに先ほどのタブ区切りテキストをペーストします -->
        <textarea id="pasteArea" class="w-full h-32 p-2 border border-black rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"></textarea>
      </div>

      <!-- 展開ボタン -->
      <button id="parseBtn" class="w-full bg-[#28a745] hover:bg-green-600 text-white font-bold py-3 rounded text-sm transition-colors mb-6">
        変わり身データを展開
      </button>

      <!-- 展開結果テーブル -->
      <div class="overflow-x-auto border border-[#2c3e50] rounded-t">
        <table class="w-full border-collapse min-w-[600px] text-sm">
          <thead>
            <tr class="bg-[#2c3e50] text-white whitespace-nowrap text-center">
              <th class="p-2 border-r border-[#34495e] w-8">番</th>
              <th class="p-2 border-r border-[#34495e] w-32">馬名</th>
              <th class="p-2 border-r border-[#34495e] w-12">距離</th>
              <th class="p-2 border-r border-[#34495e] w-12">向き</th>
              <th class="p-2 border-r border-[#34495e] w-12">馬場</th>
              <th class="p-2 border-r border-[#34495e] w-20">騎手変</th>
              <th class="p-2 border-r border-[#34495e] w-20">馬具等</th>
              <th class="p-2 w-32">メモ</th>
            </tr>
          </thead>
          <tbody id="resultTableBody">
            <!-- JavaScriptでここにデータが入ります -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('parseBtn').addEventListener('click', () => {
      const text = document.getElementById('pasteArea').value;
      const lines = text.trim().split('\n');
      const tbody = document.getElementById('resultTableBody');
      tbody.innerHTML = ''; 

      lines.forEach(line => {
        if (!line.trim()) return;

        // タブで分割
        const cols = line.split('\t');

        // 番号と馬名を分ける
        const numNameStr = cols[0] ? cols[0].trim() : '';
        const match = numNameStr.match(/^(\d+)\s+(.+)$/);
        let num = '';
        let name = numNameStr;
        if (match) {
          num = match[1];
          name = match[2];
        }

        // コピー元の並び： 騎手変(cols[1]), 距離変(cols[2]), 向き(cols[3]), 競馬場(cols[4])
        const kishuMark = cols[1] ? cols[1].trim() : '';
        const isDist = (cols[2] && cols[2].trim() !== '') ? 'checked' : '';
        const isMuki = (cols[3] && cols[3].trim() !== '') ? 'checked' : '';
        const isBajo = (cols[4] && cols[4].trim() !== '') ? 'checked' : '';

        // 行の生成
        const tr = document.createElement('tr');
        tr.className = 'border-b text-center bg-white hover:bg-gray-50';

        tr.innerHTML = `
          <td class="p-2 font-bold border-r border-gray-200">${num}</td>
          <td class="p-2 text-left border-r border-gray-200">${name}</td>

          <!-- 距離 (スライドトグル) -->
          <td class="p-2 border-r border-gray-200">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" ${isDist}>
              <div class="w-8 h-4 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-green-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all"></div>
            </label>
          </td>

          <!-- 向き (スライドトグル) -->
          <td class="p-2 border-r border-gray-200">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" ${isMuki}>
              <div class="w-8 h-4 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-green-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all"></div>
            </label>
          </td>

          <!-- 競馬場 (スライドトグル) -->
          <td class="p-2 border-r border-gray-200">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" ${isBajo}>
              <div class="w-8 h-4 bg-gray-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-green-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all"></div>
            </label>
          </td>

          <!-- 騎手変 (手入力) -->
          <td class="p-1 border-r border-gray-200">
            <input type="text" value="${kishuMark}" class="w-full p-1 border rounded text-xs text-center focus:ring-1 focus:ring-blue-500 outline-none">
          </td>

          <!-- 馬具等 (手入力) -->
          <td class="p-1 border-r border-gray-200">
            <input type="text" class="w-full p-1 border rounded text-xs text-center focus:ring-1 focus:ring-blue-500 outline-none">
          </td>

          <!-- メモ (手入力) -->
          <td class="p-1">
            <input type="text" class="w-full p-1 border rounded text-xs focus:ring-1 focus:ring-blue-500 outline-none">
          </td>
        `;
        
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
