<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>競馬指数予想（プロトタイプ）</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #4CAF50; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .score { font-weight: bold; color: #d32f2f; }
    .top3 { background: #fff3e0 !important; }
  </style>
</head>
<body>
  <h1>競馬指数予想（サンプル）</h1>
  <p>このページはサンプルデータで動いています。Python側でOCR＋保存した結果をJSONで渡せば本格運用できます。</p>
  <div id="result"></div>

  <script>
    // サンプルデータ（実際はAPIやJSONファイルから取得）
    const sample = {
      race_name: "2歳未勝利（サンプル）",
      horses: [
        {"number":5,"name":"マルモリマイベスト","popularity":1,"sp":89,"ag":43,"s":39,"a":51,"sa":97,"score":62.1},
        {"number":10,"name":"ダイユウエゾフジ","popularity":10,"sp":94,"ag":82,"s":36,"a":50,"sa":98,"score":70.8},
        {"number":13,"name":"ジャスコヒラリアス","popularity":6,"sp":82,"ag":45,"s":46,"a":52,"sa":98,"score":64.5},
        {"number":7,"name":"シムサラビン","popularity":5,"sp":59,"ag":100,"s":42,"a":52,"sa":94,"score":68.9},
        {"number":11,"name":"エリーマイラヴ","popularity":9,"sp":70,"ag":52,"s":45,"a":50,"sa":95,"score":61.2},
        {"number":1,"name":"スリーオブスペイズ","popularity":2,"sp":82,"ag":12,"s":46,"a":48,"sa":94,"score":55.3},
        {"number":14,"name":"ピコジャック","popularity":7,"sp":59,"ag":28,"s":30,"a":47,"sa":94,"score":52.8},
        {"number":3,"name":"ウィナーズクロノ","popularity":14,"sp":86,"ag":0,"s":25,"a":37,"sa":94,"score":48.6},
        {"number":15,"name":"ヤマトデュノール","popularity":15,"sp":25,"ag":55,"s":33,"a":43,"sa":68,"score":41.2},
        {"number":4,"name":"ランズエンド","popularity":13,"sp":0,"ag":0,"s":21,"a":39,"sa":68,"score":32.1},
        {"number":2,"name":"ゴールドアーク","popularity":16,"sp":0,"ag":0,"s":17,"a":34,"sa":51,"score":24.5},
        {"number":9,"name":"エアロクリスタ","popularity":3,"sp":0,"ag":0,"s":0,"a":0,"sa":0,"score":10.4},
        {"number":8,"name":"ベラジオセブン","popularity":4,"sp":0,"ag":0,"s":0,"a":0,"sa":0,"score":9.6},
        {"number":12,"name":"アセンシオン","popularity":8,"sp":0,"ag":0,"s":0,"a":0,"sa":0,"score":6.4},
        {"number":6,"name":"ピエナマーズ","popularity":12,"sp":0,"ag":0,"s":0,"a":0,"sa":0,"score":3.2},
        {"number":16,"name":"ヴァルダンセ","popularity":11,"sp":0,"ag":0,"s":0,"a":0,"sa":0,"score":4.0}
      ]
    };

    function render(data) {
      const sorted = [...data.horses].sort((a, b) => b.score - a.score);
      let html = `<h2>${data.race_name}</h2><table>
        <tr><th>順位</th><th>馬番</th><th>馬名</th><th>人気</th><th>SP</th><th>AG</th><th>SA</th><th>スコア</th></tr>`;
      sorted.forEach((h, i) => {
        const cls = i < 3 ? 'top3' : '';
        html += `<tr class="${cls}">
          <td>${i+1}</td><td>${h.number}</td><td>${h.name}</td>
          <td>${h.popularity}</td><td>${h.sp}</td><td>${h.ag}</td><td>${h.sa}</td>
          <td class="score">${h.score}</td></tr>`;
      });
      html += '</table>';
      document.getElementById('result').innerHTML = html;
    }

    render(sample);
  </script>
</body>
</html>
